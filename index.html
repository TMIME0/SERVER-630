<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Server 630 - نظام الإمداد والسيطرة</title>
    <!-- مكتبة Supabase للاتصال بقاعدة البيانات -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-color: #0b0c10;
            --panel-bg: #1f2833;
            --accent-color: #c5a059;
            --text-color: #c7d5e0;
        }
        body {
            font-family: 'Tahoma', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .login-card {
            background-color: var(--panel-bg);
            border: 2px solid var(--accent-color);
            border-radius: 12px;
            padding: 30px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.6);
            text-align: center;
        }
        h2 {
            color: var(--accent-color);
            margin-bottom: 25px;
            font-size: 24px;
        }
        .input-group {
            margin-bottom: 15px;
            text-align: right;
        }
        .input-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 13px;
            color: var(--accent-color);
        }
        input {
            width: 100%;
            padding: 12px;
            background-color: #0b0c10;
            border: 1px solid #45a29e;
            border-radius: 6px;
            color: #fff;
            box-sizing: border-box;
            font-size: 14px;
        }
        input:focus {
            outline: none;
            border-color: var(--accent-color);
        }
        .btn {
            background-color: var(--accent-color);
            color: #0b0c10;
            border: none;
            padding: 12px;
            width: 100%;
            border-radius: 6px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
            transition: 0.3s;
        }
        .btn:hover {
            opacity: 0.9;
        }
        .admin-section {
            margin-top: 25px;
            border-top: 1px dashed #45a29e;
            padding-top: 20px;
        }
        #admin-login-box {
            display: none;
            margin-top: 15px;
        }
        .toggle-admin-btn {
            background: none;
            border: none;
            color: var(--accent-color);
            cursor: pointer;
            text-decoration: underline;
            font-size: 13px;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <h2>SERVER 630</h2>
        
        <!-- نموذج دخول العضو -->
        <div id="member-login-section">
            <div class="input-group">
                <label>ايميل دخول العضو</label>
                <input type="email" id="member-email" placeholder="أدخل ايميل العضو">
            </div>
            <div class="input-group">
                <label>رمز دخول العضو</label>
                <input type="password" id="member-password" placeholder="أدخل رمز المرور">
            </div>
            <button class="btn" id="member-login-btn">دخول العضو</button>
        </div>

        <!-- زر تفعيل لوحة الأدمن -->
        <div class="admin-section">
            <button class="toggle-admin-btn" id="admin-toggle-btn">هل أنت الأدمن؟ اضغط هنا للتحويل إلى بوابة القيادة</button>
            
            <div id="admin-login-box">
                <div class="input-group" style="margin-top: 15px;">
                    <label>كود الأدمن</label>
                    <input type="text" id="admin-code" placeholder="أدخل كود الأدمن" value="1G630">
                </div>
                <div class="input-group">
                    <label>رمز الدخول</label>
                    <input type="password" id="admin-password" placeholder="أدخل رمز الأدمن">
                </div>
                <button class="btn" id="admin-login-btn">دخول لوحة القيادة</button>
            </div>
        </div>
    </div>

    <script>
        // إعدادات الاتصال الحقيقية والمضبوطة بـ Supabase
        const SUPABASE_URL = 'https://nncahhqiongbxgyblzed.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_085jka1i9o5ceXelPxid-w_3H4wI6Hw80r3W6gP8d5b'; 
        
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        window.handleLogin = async function() {
            const codeInput = document.getElementById('admin-code').value.trim();
            if (!codeInput) {
                alert('يرجى إدخال كود الأدمن');
                return;
            }

            try {
                const { data, error } = await supabaseClient
                    .from('admins')
                    .select('*')
                    .eq('code', codeInput)
                    .single();

                if (error || !data) {
                    alert('كود الأدمن غير صحيح أو غير مسجل في النظام!');
                    return;
                }

                if (!data.active) {
                    alert('هذا الحساب معطل حالياً.');
                    return;
                }

                alert('تم تسجيل الدخول بنجاح إلى لوحة القيادة لـ Server 630! 🦅');
            } catch (err) {
                alert('حدث خطأ في الاتصال بقاعدة البيانات: ' + err.message);
            }
        };

        window.handleMemberLogin = async function() {
            const email = document.getElementById('member-email').value.trim();
            const password = document.getElementById('member-password').value.trim();
            if (!email || !password) {
                alert('يرجى إدخال البريد الإلكتروني وكلمة المرور');
                return;
            }
            alert('جاري التحقق من بيانات العضو...');
        };

        // ربط الأزرار
        (function(){
            function bindEvents() {
                var adminToggle = document.getElementById('admin-toggle-btn');
                var adminBox = document.getElementById('admin-login-box');
                if (adminToggle && adminBox && !adminToggle.dataset.bound) {
                    adminToggle.dataset.bound = '1';
                    adminToggle.addEventListener('click', function() {
                        var isVisible = getComputedStyle(adminBox).display !== 'none';
                        adminBox.style.setProperty('display', isVisible ? 'none' : 'block', 'important');
                    });
                }
                
                var memberBtn = document.getElementById('member-login-btn'); 
                if (memberBtn && !memberBtn.dataset.bound) {
                    memberBtn.dataset.bound = '1';
                    memberBtn.addEventListener('click', function() { window.handleMemberLogin(); });
                }
                
                var adminBtn = document.getElementById('admin-login-btn'); 
                if (adminBtn && !adminBtn.dataset.bound) {
                    adminBtn.dataset.bound = '1';
                    adminBtn.addEventListener('click', function() { window.handleLogin(); });
                }
            }
            if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', bindEvents);
            else bindEvents();
        })();
    </script>
</body>
</html>
